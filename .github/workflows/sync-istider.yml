name: Sync Istider

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Istider.html
        run: |
          curl -L "https://karlskronahockey-my.sharepoint.com/:u:/g/personal/web_khk_se/IQCIWG0sp7pnRrFjSCne2hxWAV8sLRfOwd6xLAUbNXeBv9Q?e=b3rU9D" -o index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update istider"
            git push
          fi
